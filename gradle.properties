# Archivo de propiedades de configuración global de Gradle (gradle.properties),
# encargado de definir parámetros de la máquina virtual Java (JVM) para el demonio de Gradle,
# opciones de codificación, estilos de código en Kotlin y directivas de compatibilidad con AndroidX.

# Especifica los argumentos de la JVM para el proceso del demonio, asignando un límite máximo de memoria RAM de 2048 MB (-Xmx2048m)
# y estableciendo la codificación de caracteres predeterminada en UTF-8.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Configuración comentada para habilitar el modo paralelo en proyectos desacoplados de Gradle.
# org.gradle.parallel=true

# Establece el estilo de código oficial para los archivos desarrollados en Kotlin dentro del proyecto.
kotlin.code.style=official

# Permite o deshabilita el uso de conjuntos de fuentes de Kotlin en Android.
android.disallowKotlinSourceSets=false

# Desactiva explícitamente el almacenamiento en caché de la configuración de Gradle para evitar problemas de compatibilidad con plugins.
org.gradle.configuration-cache=false

# Habilita el uso de las librerías de soporte de AndroidX en todo el proyecto.
android.useAndroidX=true

# Activa la generación de clases R no transitivas para optimizar los tiempos de compilación de los módulos.
android.nonTransitiveRClass=true